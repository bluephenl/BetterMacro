[package]
name = "bettermacro"
version = "0.3.3"
description = "A local-first macOS macro recorder"
authors = ["BetterMacro contributors"]
edition = "2021"

[lib]
name = "bettermacro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-global-shortcut = "=2.3.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
